name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.4 python3-numpy
      - run: lua5.4 tests/voice_spec.lua
      - run: lua5.4 tests/playback_spec.lua
      - run: lua5.4 tests/menu_reload_spec.lua
      - run: /usr/bin/python3 -m unittest discover -s tests -p 'test_*.py'
