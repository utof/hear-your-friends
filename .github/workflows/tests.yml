name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.4 python3-numpy
      - run: for suite in tests/*_spec.lua; do lua5.4 "$suite" || exit; done
      - run: /usr/bin/python3 -m unittest discover -s tests -p 'test_*.py'
